<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bir şeyler ters gitti — KararVeremedim</title>
  <style>
    /* Standalone on purpose: the 500 page is rendered without template context. */
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box;
           background: #FBF9FF; color: #1F1B2E; font-family: system-ui, sans-serif; text-align: center; }
    .box { max-width: 420px; }
    .emoji { font-size: 3.5rem; margin: 0; }
    h1 { font-size: 1.5rem; margin: 8px 0; }
    p { color: #6E6A80; margin: 0 0 20px; }
    a { display: inline-block; padding: 12px 22px; border-radius: 999px; color: #fff; font-weight: 700;
        text-decoration: none; background: linear-gradient(90deg, #7B2FF7, #FF3D81); }
    a:focus-visible { outline: 3px solid #7B2FF7; outline-offset: 2px; }
  </style>
</head>
<body>
  <main class="box">
    <p class="emoji" aria-hidden="true">🛠️</p>
    <h1>Bir şeyler ters gitti</h1>
    <p>Bizden kaynaklı bir sorun oldu. Biraz sonra tekrar dene.</p>
    <a href="/">Ana sayfaya dön</a>
  </main>
</body>
</html>
