<header class="topbar">
  <div class="container topbar__inner">
    <a class="logo" href="/">
      <span class="logo__emoji" aria-hidden="true">🤔</span>
      <span>Karar<span class="logo__accent">Veremedim</span></span>
    </a>
    <nav class="topbar__nav" aria-label="Ana menü">
      {% if user.is_authenticated %}
        {# TODO(Faz 2): link @username to the user's profile page #}
        <span class="topbar__user">@{{ user.username }}</span>
        <form method="post" action="{% url 'accounts:logout' %}" class="topbar__logout">
          {% csrf_token %}
          <button type="submit" class="btn btn--ghost btn--sm">Çıkış</button>
        </form>
      {% else %}
        <a class="btn btn--ghost btn--sm" href="{% url 'accounts:login' %}">Giriş</a>
        <a class="btn btn--ghost btn--sm" href="{% url 'accounts:register' %}">Üye ol</a>
      {% endif %}
      {# TODO(Faz 2): link to /anket/yeni/ #}
      <a class="btn btn--primary btn--sm topbar__create" href="#">+ Anket oluştur</a>
    </nav>
  </div>
</header>
