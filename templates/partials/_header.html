<header class="topbar">
  <div class="container topbar__inner">
    <a class="logo" href="/">
      <span class="logo__emoji" aria-hidden="true">🤔</span>
      <span>Karar<span class="logo__accent">Veremedim</span></span>
    </a>
    <nav class="topbar__nav" aria-label="Ana menü">
      {% if user.is_authenticated %}
        <details class="usermenu" data-usermenu>
          <summary class="usermenu__toggle">@{{ user.username }}</summary>
          <div class="usermenu__panel">
            <a class="usermenu__item" href="{% url 'polls:mine' %}">Anketlerim</a>
            <a class="usermenu__item" href="{% url 'polls:profile' user.username %}">Profilim</a>
            <form method="post" action="{% url 'accounts:logout' %}" class="usermenu__form">
              {% csrf_token %}
              <button type="submit" class="usermenu__item usermenu__item--button">Çıkış</button>
            </form>
          </div>
        </details>
      {% else %}
        <a class="btn btn--ghost btn--sm" href="{% url 'accounts:login' %}">Giriş</a>
        <a class="btn btn--ghost btn--sm" href="{% url 'accounts:register' %}">Üye ol</a>
      {% endif %}
      <a class="btn btn--primary btn--sm topbar__create" href="{{ create_poll_url }}">+ Anket oluştur</a>
    </nav>
  </div>
</header>
